<!doctype html>
<html lang="fr" data-map="zombie_theater">
<head>
  <meta charset="utf-8">
  <!-- integ12: served at /five/ or /kino/ (vel.gg root routing): resolve relative URLs (and maps.js BASE) from the site directory. -->
  <script>if (/\/(five|kino)\/$/.test(location.pathname)) document.write('<base href="../">');</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Kino der Toten</title>
  <!-- linkcard: link preview (index.html); mkpages.mjs swaps the map name into og:title. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BO1 Zombies">
  <meta property="og:title" content="Kino der Toten | BO1 Zombies">
  <meta property="og:description" content="Le mode Zombies de Black Ops dans votre navigateur.">
  <meta property="og:image" content="https://bo1.znoam.eu/bo1z/art/og-mapselect.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="art/loadscreen_zombie_theater.webp">
  <link rel="stylesheet" href="play.css">
  <link rel="stylesheet" href="touch.css?v=mobile-20261010-5">
  <style>:root { --art: url(art/loadscreen_zombie_theater.webp); }</style>
</head>
<body data-screen="landing">
  <!-- The canvas carries the map loadscreen art until the engine draws its own loading screen. -->
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Kino der Toten"></canvas>
  <main id="overlay">
    <div class="prompt">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="error-message" class="error-message" role="alert" hidden></p>
      <details id="error-debug" hidden><summary>Détails techniques</summary><pre id="error-debug-message"></pre></details>
      <p id="notice" class="notice" hidden></p>
      <div class="actions">
        <button id="play" class="option" disabled>Chargement</button>
        <button id="secondary" class="option" hidden>Réessayer</button>
      </div>
      <p id="details"></p>
    </div>
    <div id="transfer" class="loadbar" hidden>
      <p id="transfer-details" class="metrics"></p>
      <progress id="progress" max="1" aria-label="Progression du téléchargement"></progress>
    </div>
    <div id="loading" class="loadbar" hidden>
      <p id="load-details" class="metrics"></p>
      <progress id="load-progress" max="1" aria-label="Chargement"></progress>
    </div>
    <details id="settings">
      <summary>Options</summary>
      <div class="settings-body">
        <label for="sensitivity">Sensibilité de la souris <output id="sensitivity-value">5.0</output></label>
        <input id="sensitivity" type="range" min="0.5" max="15" step="0.5" value="5">
        <label for="volume">Volume général <output id="volume-value">80%</output></label>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5">
        <label class="check"><input id="fullscreen" type="checkbox"> Plein écran</label>
        <p id="mobile-quality" hidden></p>
        <p id="settings-note"></p>
      </div>
    </details>
  </main>
  <aside id="background" role="status" hidden><span id="background-label"></span><progress id="background-progress" max="1" aria-label="Téléchargement des musiques et des voix"></progress><button id="background-retry" class="option" hidden>Réessayer</button></aside>
  <p id="resume-hint" class="resume-hint" hidden>Cliquer pour reprendre</p>
  <script type="module" src="play.mobile-start-20261011-1.js"></script>
</body>
</html>
